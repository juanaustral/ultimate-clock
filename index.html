<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f9fb">
    <meta name="description" content="Ultimate Clock: tablero de cronómetros para partidos de Ultimate Frisbee.">
    <title>ULTIMATE CLOCK</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="ultimate-clock.css">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="clock-engine.js" defer></script>
    <script src="alerts.js" defer></script>
    <script src="sheet-export.js" defer></script>
    <script src="ultimate-clock.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#tablero" aria-label="ULTIMATE CLOCK, tablero"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="25" y="2" width="14" height="7" rx="2.5" fill="currentColor"/><rect x="29.5" y="8" width="5" height="6" fill="currentColor"/><circle cx="32" cy="38" r="23" fill="#1b47e2"/><circle cx="32" cy="38" r="21.5" fill="none" stroke="#0b2a9e" stroke-width="3"/><circle cx="32" cy="38" r="15.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5"/><path d="M32 38V22.5A15.5 15.5 0 0 1 45.42 30.25Z" fill="#fff"/><circle cx="32" cy="38" r="3" fill="#fff"/></svg><span class="brand-copy"><strong>ULTIMATE CLOCK</strong></span></a>
        <button class="menu-button" type="button" data-action="toggle-menu" aria-expanded="false" aria-controls="headerActions">MENU</button>
        <nav class="header-actions" id="headerActions" aria-label="Opciones del partido">
          <div class="menu-brand" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="25" y="2" width="14" height="7" rx="2.5" fill="currentColor"/><rect x="29.5" y="8" width="5" height="6" fill="currentColor"/><circle cx="32" cy="38" r="23" fill="#1b47e2"/><circle cx="32" cy="38" r="21.5" fill="none" stroke="#0b2a9e" stroke-width="3"/><circle cx="32" cy="38" r="15.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5"/><path d="M32 38V22.5A15.5 15.5 0 0 1 45.42 30.25Z" fill="#fff"/><circle cx="32" cy="38" r="3" fill="#fff"/></svg><strong>ULTIMATE CLOCK</strong></div>
          <div class="mode-switch" role="group" aria-label="Modo visual"><button type="button" data-action="quick-theme" data-theme="light" aria-pressed="true">MODO CLARO</button><button type="button" data-action="quick-theme" data-theme="dark" aria-pressed="false">MODO OSCURO</button></div>
          <span class="menu-group-label" aria-hidden="true">PARTIDO</span>
          <button class="icon-button menu-primary" type="button" data-action="new-match">＋ NUEVO PARTIDO</button>
          <button class="icon-button" type="button" data-action="sheet">PLANILLA</button>
          <button class="icon-button" type="button" data-action="save" aria-label="Guardar partido"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h15l3 3v15H3zM7 3v7h10V3M7 21v-8h10v8"/></svg><span class="button-label">GUARDAR</span></button>
          <span class="menu-group-label" aria-hidden="true">SONIDO Y PANTALLA</span>
          <button class="icon-button audio-header" type="button" data-action="enable-audio" aria-label="ACTIVAR SONIDO" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6a8 8 0 0 1 0 12"/></svg><span class="audio-label">ACTIVAR SONIDO</span></button>
          <button class="icon-button audio-test" type="button" data-action="test-audio"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6a8 8 0 0 1 0 12"/></svg><span>PROBAR SONIDO</span></button>
          <button class="icon-button" type="button" data-action="fullscreen" aria-label="PANTALLA COMPLETA">PANTALLA COMPLETA</button>
          <button class="icon-button" type="button" data-action="settings" aria-label="Abrir configuración">⚙ <span class="button-label">CONFIGURAR</span></button>
          <span class="menu-group-label" aria-hidden="true">AYUDA</span>
          <button class="icon-button" type="button" data-action="start-tutorial">CÓMO USAR LA APP</button>
          <button class="icon-button" type="button" data-action="info" aria-label="Información de la app">INFO</button>
          <button class="icon-button menu-danger" type="button" data-action="reset" aria-label="Reiniciar contadores">REINICIAR CONTADORES</button>
        </nav>
      </header>

      <div id="bootFallback" role="status" style="max-width:700px;margin:32px auto;padding:24px;border:2px solid #1b47e2;background:#fff;color:#191c1e;font:16px/1.5 system-ui,sans-serif"><strong>Si el tablero no aparece:</strong> recargá la página. Si usás el ZIP descargado, extraé la carpeta completa y abrí <em>Iniciar Ultimate Clock.command</em>.</div>
      <main id="app" class="app-main" tabindex="-1"></main>
      <footer class="site-footer" aria-label="Créditos y apoyo">
        <a href="https://iona.ar/" target="_blank" rel="noopener noreferrer"><span class="footer-long">DESARROLLADO POR&nbsp;</span>IONA.AR</a>
        <a class="footer-ufm" href="https://www.instagram.com/ultimatefrisbeemza/" target="_blank" rel="noopener noreferrer">ULTIMATE FRISBEE MENDOZA</a>
        <a href="#" data-action="donation-info" aria-label="Apoyá este proyecto">APOYÁ ESTE PROYECTO</a>
      </footer>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <div id="liveRegion" class="sr-only" aria-live="assertive"></div>
      <div id="modalRoot"></div>
    </div>
    <div id="tutorialRoot"></div>
  </body>
</html>
